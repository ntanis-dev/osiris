<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Osiris</title>
  <desc id="desc">Every Claude Code window back after a sudden restart. A broken terminal window mended with gold rising over the horizon at dawn, its last pieces drifting back into place, and below it a terminal that reopened nine windows.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#121519"/>
      <stop offset="0.62" stop-color="#231d15"/>
      <stop offset="0.66" stop-color="#121519"/>
      <stop offset="1" stop-color="#121519"/>
    </linearGradient>
    <radialGradient id="glow" gradientUnits="userSpaceOnUse" cx="220" cy="236" r="270">
      <stop offset="0" stop-color="#ffd98a" stop-opacity="0.75"/>
      <stop offset="0.3" stop-color="#e8a33d" stop-opacity="0.38"/>
      <stop offset="0.65" stop-color="#e8903d" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#e8903d" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="above"><rect x="0" y="0" width="1200" height="236"/></clipPath>
    <g id="win">
      <rect x="70" y="85" width="300" height="190" rx="12" fill="#1a1f25" stroke="#4fbf8f" stroke-width="2"/>
      <path d="M71 117 H369" stroke="#2c343d" stroke-width="1.5"/>
      <circle cx="92" cy="101" r="5" fill="#4fbf8f"/><circle cx="110" cy="101" r="5" fill="#343a43"/><circle cx="128" cy="101" r="5" fill="#343a43"/>
      <text x="146" y="106" font-family="ui-monospace, 'Cascadia Mono', Consolas, Menlo, monospace" font-size="13" fill="#8b949e">~/GitHub/shop</text>
      <text x="92" y="152" font-family="ui-monospace, 'Cascadia Mono', Consolas, Menlo, monospace" font-size="15" fill="#c9d1d9"><tspan fill="#4fbf8f">&#x203a;</tspan> claude --resume 7a52…</text>
      <rect x="92" y="172" width="196" height="8" rx="4" fill="#2a313a"/>
      <rect x="92" y="192" width="244" height="8" rx="4" fill="#2a313a"/>
      <rect x="92" y="212" width="150" height="8" rx="4" fill="#2a313a"/>
      <rect x="92" y="238" width="10" height="18" fill="#4fbf8f"/>
    </g>
    <clipPath id="s1"><polygon points="60,75 205,75 172,172 60,150"/></clipPath>
    <clipPath id="s2"><polygon points="205,75 380,75 380,138 262,166 172,172"/></clipPath>
    <clipPath id="s3"><polygon points="60,150 172,172 152,285 60,285"/></clipPath>
    <clipPath id="s4"><polygon points="172,172 262,166 292,285 152,285"/></clipPath>
    <clipPath id="s5"><polygon points="262,166 380,138 380,285 292,285"/></clipPath>
  </defs>
  <rect x="0.5" y="0.5" width="1199" height="359" rx="16" fill="url(#sky)" stroke="#343a43"/>

  <g clip-path="url(#above)">
    <rect x="0" y="0" width="1200" height="236" fill="url(#glow)"/>
    <g transform="translate(220 236) scale(0.92) translate(-220 -275)">
      <use href="#win" clip-path="url(#s1)"/>
      <use href="#win" clip-path="url(#s3)"/>
      <use href="#win" clip-path="url(#s4)"/>
      <path d="M71 152 L172 172 L154 274 M172 172 L262 166" fill="none" stroke="#e3b15a" stroke-width="2.5" stroke-linejoin="round"/>
      <g transform="translate(18 -16) rotate(3 290 120)" opacity="0.92"><use href="#win" clip-path="url(#s2)"/></g>
      <g transform="translate(22 12) rotate(-4 330 230)" opacity="0.8"><use href="#win" clip-path="url(#s5)"/></g>
      <g stroke="#e8a33d" stroke-width="2.5" stroke-linecap="round" opacity="0.5">
        <path d="M424 48 L446 38"/><path d="M430 66 L462 56"/>
      </g>
    </g>
  </g>
  <path d="M40 236 H1160" stroke="#4a4136" stroke-width="2"/>
  <g stroke="#e8a33d" stroke-linecap="round" opacity="0.32">
    <path d="M130 254 H310" stroke-width="5"/><path d="M165 270 H275" stroke-width="4"/><path d="M196 286 H244" stroke-width="3"/>
  </g>

  <text x="500" y="150" font-family="system-ui, -apple-system, 'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="76" font-weight="700" fill="#f2efe8" letter-spacing="2">Osiris</text>
  <text x="502" y="198" font-family="system-ui, -apple-system, 'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="25" fill="#e9dcc6">Every Claude Code window back after a sudden restart.</text>
  <g font-family="ui-monospace, 'Cascadia Mono', Consolas, Menlo, monospace" font-size="17">
    <text x="502" y="282" fill="#c9d1d9"><tspan fill="#e8a33d">&#x203a;</tspan> osiris</text>
    <text x="502" y="310" fill="#8b949e">Reopened 9 windows, each in its folder, on its conversation.</text>
    <rect x="590" y="268" width="9" height="17" fill="#e8a33d"/>
  </g>
</svg>
